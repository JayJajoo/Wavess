# XcodeGen spec — a reliable fallback for regenerating Wavess.xcodeproj.
#
# The committed Wavess.xcodeproj opens directly in Xcode 16+. If you are on an
# older Xcode, or the project file ever gets into a bad state, regenerate it:
#
#   brew install xcodegen
#   xcodegen generate
#   open Wavess.xcodeproj
#
name: Wavess
options:
  bundleIdPrefix: com.wavess
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Wavess:
    type: application
    platform: iOS
    sources:
      - path: Wavess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wavess.app
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Wavess saves your edited videos to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
